{% comment %}Loading circle. spinner_alpine = an Alpine expression for x-show toggling; spinner_override = the full class list; otherwise default hidden + optional Tailwind display classes via spinner_extras.{% endcomment %}
{% if spinner_alpine %}
  <svg class="hidden h-4 w-4 animate-spin" x-show="{{ spinner_alpine }}" x-cloak fill="none" viewBox="0 0 24 24" aria-hidden="true">
{% elif spinner_override %}
  <svg class="{{ spinner_override }}" fill="none" viewBox="0 0 24 24" aria-hidden="true">
{% else %}
  <svg class="hidden h-4 w-4 animate-spin {{ spinner_extras }}" fill="none" viewBox="0 0 24 24" aria-hidden="true">
{% endif %}
