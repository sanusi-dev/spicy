{% load static %}
{# Spicy brand icon set — files live in static/images/favicons #}
<link rel="icon" href="{% static 'images/favicons/favicon.ico' %}" sizes="any">
<link rel="icon" href="{% static 'images/favicons/favicon.svg' %}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{% static 'images/favicons/apple-touch-icon.png' %}">
<link rel="manifest" href="{% static 'images/favicons/site.webmanifest' %}">
<link rel="mask-icon" href="{% static 'images/favicons/safari-pinned-tab.svg' %}" color="#aa1845">
<meta name="msapplication-config" content="{% static 'images/favicons/browserconfig.xml' %}">
<meta name="msapplication-TileColor" content="#aa1845">
<meta name="theme-color" content="#aa1845">
