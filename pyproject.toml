[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
    ".direnv",
    ".git",
    ".ruff_cache",
    "node_modules",
    "migrations",
]
line-length = 120
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
fixable = [
    "ALL",
]
unfixable = []
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]

# Third-party libraries without type stubs - explicitly list each to suppress import-untyped
[[tool.mypy.overrides]]
module = [
    "allauth.*",
    "celery.*",
    "django_celery_beat.*",
    "environ.*",
    "kombu.*",
]
ignore_missing_imports = true

# Django admin files have known issues with decorators and type annotations
# Disable specific error codes that are problematic
[[tool.mypy.overrides]]
module = [
    "apps.*.admin",
]
disable_error_code = ["attr-defined", "assignment"]

[tool.django-stubs]
django_settings_module = "spicy.settings"

[tool.setuptools]
py-modules = []

[project]
name = "spicy"
version = "0.1.0"
description = "Spicy is a light weight and easy to use web-based application designed for streamlined order management. It serves as an efficient tool for both cashiers and captains, facilitating order processing at the cash counter and tables.It supports various order types, including dine-in, delivery, takeout and Aggregator."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "Django>=6.0",
    "celery",
    "celery[redis]",
    "django-allauth>=65.13.0",
    "django-celery-beat",
    "django-environ",
    "django-htmx",
    "django-hugeicons-stroke==1.1.2",
    "django-vite>=3.1.0",
    "mypy>=1.18.2,<2",
    "pillow>=12.3.0",
    "psycopg",
    "redis",
]

[dependency-groups]
dev = [
    "django-browser-reload",
    "django-debug-toolbar",
    "django-watchfiles",
    "pre-commit",
    "ruff>=0.15.6",
    "pegasus-cli>=0.15",
    "psycopg[binary]",
    "mypy>=1.18.2",
    "django-stubs>=5.0.0",
    "types-python-dateutil>=2.9.0.20251108",
    "djlint>=1.45.2",
]
prod = [
    "gunicorn",
    "psycopg[c]",
]

[tool.djlint]
indent = 2
profile = "django"
extension = "html"
format-js = true
format-css = true
# Repo keeps {% block %} and {% partialdef %} contents at the same column as
# the tag; skip indenting their children.
ignore_blocks = "block, partialdef"
# Repo keeps long HTMX/Tailwind attribute strings on one line. Set the
# attribute/length thresholds high so djlint doesn't wrap them; it still
# expands structural elements (table headers, inline dt/dd) cleanly.
max_line_length = 100000
max_attribute_length = 100000
